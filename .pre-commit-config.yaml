# Pre-commit configuration for MCP Python Analyzer
# See https://pre-commit.com for more information

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  # Python-specific checks with RUFF
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Linter
      - id: ruff
        args: [--fix]
      # Formatter
      - id: ruff-format

  # Type checking with ty
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.55
    hooks:
      - id: ty

  # Pyupgrade for python version itself
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  # JavaScript/TypeScript linting and formatting with Biome (requires: npm ci)
  - repo: local
    hooks:
      - id: biome
        name: biome check (JS/TS)
        entry: npx --no-install biome check --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: true
        require_serial: true

  # Security/SAST scanning with Semgrep (falls back to `uvx semgrep` if not
  # installed locally, matching semgrep-check's own discovery order)
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep check (security/SAST)
        entry: bash -c 'command -v semgrep >/dev/null 2>&1 && semgrep --config auto --error --quiet "$@" || uvx semgrep --config auto --error --quiet "$@"' --
        language: system
        types: [python]
        pass_filenames: true

  # GitHub Actions workflow linting with actionlint (requires: actionlint binary)
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (GitHub Actions workflows)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

  # Secret scanning with gitleaks (requires: gitleaks binary)
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks dir --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true

  # Release policy checks with repo-release-tools
  - repo: https://github.com/Anselmoo/repo-release-tools
    rev: v1.10.1
    hooks:
      - id: rrt-branch-name
      - id: rrt-commit-subject
      - id: rrt-changelog

# Configuration for specific tools
default_language_version:
  python: python3.13

default_stages: [pre-commit]

# Speed up by focusing on source files only
exclude: ^(\.venv/|\.git/|__pycache__/|examples/)
